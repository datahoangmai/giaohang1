<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Glowing Radar Ring -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="12 12" opacity="0.4"/>
  <circle cx="256" cy="240" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" opacity="0.2"/>

  <!-- Package / Delivery Box Core -->
  <g transform="translate(136, 120)">
    <!-- Delivery Van / Fast Bike Silhouette with Location Pin -->
    <path d="M40 180 L200 180 L200 80 L80 80 L40 120 Z" fill="url(#accent)" opacity="0.95" filter="url(#glow)"/>
    <!-- Van Cab Window -->
    <path d="M50 125 L75 95 L115 95 L115 125 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Van Wheels -->
    <circle cx="80" cy="185" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
    <circle cx="80" cy="185" r="10" fill="#10b981"/>
    <circle cx="170" cy="185" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
    <circle cx="170" cy="185" r="10" fill="#10b981"/>

    <!-- Speed Lines -->
    <line x1="0" y1="100" x2="25" y2="100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="-15" y1="130" x2="15" y2="130" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <line x1="-5" y1="160" x2="20" y2="160" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Big Location Pin & Notification Bell on top right -->
  <g transform="translate(300, 100)">
    <path d="M45 0 C20.147 0 0 20.147 0 45 C0 78.75 45 120 45 120 C45 120 90 78.75 90 45 C90 20.147 69.853 0 45 0 Z" fill="url(#primary)" filter="url(#glow)"/>
    <circle cx="45" cy="45" r="20" fill="#ffffff"/>
    <circle cx="45" cy="45" r="10" fill="#0f172a"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    HACHIHI DELIVERY
  </text>
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="4">
    DISPATCH &amp; DRIVER PWA
  </text>
</svg>
